<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE9FF"/>
      <stop offset="0.55" stop-color="#E8DDFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B79D6"/>
      <stop offset="1" stop-color="#4C58AC"/>
    </linearGradient>
  </defs>

  <!-- Иконный скруглённый квадрат на весь холст -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- QR-блок: край карточки растворяется в модулях -->
  <g fill="#1C1B22">
    <!-- модули, свисающие с нижнего края карточки -->
    <rect x="244" y="270" width="32" height="32" rx="7"/>
    <rect x="284" y="270" width="32" height="32" rx="7"/>
    <!-- угловой модуль и ряд, продолжающий край -->
    <rect x="320" y="270" width="32" height="32" rx="7"/>
    <rect x="360" y="270" width="32" height="32" rx="7"/>
    <rect x="400" y="270" width="32" height="32" rx="7"/>
    <!-- растворение по диагонали -->
    <rect x="320" y="310" width="32" height="32" rx="7"/>
    <rect x="400" y="310" width="32" height="32" rx="7"/>
    <rect x="320" y="350" width="32" height="32" rx="7"/>
  </g>

  <!-- QR-"глаз" (finder) в правом нижнем углу блока -->
  <rect x="360" y="350" width="72" height="72" rx="16" fill="#1C1B22"/>
  <rect x="372" y="362" width="48" height="48" rx="10" fill="#F4EEFF"/>
  <rect x="384" y="374" width="24" height="24" rx="5" fill="#1C1B22"/>

  <!-- Карточка -->
  <rect x="90" y="100" width="230" height="170" rx="30" fill="url(#card)"/>
  <!-- строка-«название» на карточке -->
  <rect x="116" y="126" width="120" height="24" rx="12" fill="#FFFFFF" opacity="0.92"/>
  <!-- штрихкод на карточке -->
  <g fill="#FFFFFF" opacity="0.92">
    <rect x="116" y="196" width="12" height="44" rx="3"/>
    <rect x="134" y="196" width="6"  height="44" rx="3"/>
    <rect x="146" y="196" width="16" height="44" rx="3"/>
    <rect x="168" y="196" width="8"  height="44" rx="3"/>
    <rect x="182" y="196" width="6"  height="44" rx="3"/>
    <rect x="194" y="196" width="14" height="44" rx="3"/>
    <rect x="214" y="196" width="8"  height="44" rx="3"/>
  </g>
</svg>
