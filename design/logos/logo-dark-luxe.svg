<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262C4A"/>
      <stop offset="1" stop-color="#14182B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#8B93D9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B93D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DEE4F7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6D982"/>
      <stop offset="0.5" stop-color="#E3B84F"/>
      <stop offset="1" stop-color="#C9A43C"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="136" y="156" width="240" height="200" rx="28"/>
    </clipPath>
  </defs>

  <!-- Иконный фон: скруглённый квадрат -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- Светлая карточка -->
  <rect x="136" y="156" width="240" height="200" rx="28" fill="url(#cardGrad)"/>

  <!-- Штрихкод -->
  <g fill="#1B2032">
    <!-- guard bars -->
    <rect x="176" y="198" width="10" height="120"/>
    <rect x="326" y="198" width="10" height="120"/>
    <!-- data bars -->
    <rect x="192" y="198" width="6" height="96"/>
    <rect x="204" y="198" width="14" height="96"/>
    <rect x="224" y="198" width="6" height="96"/>
    <rect x="236" y="198" width="10" height="96"/>
    <rect x="252" y="198" width="6" height="96"/>
    <rect x="264" y="198" width="14" height="96"/>
    <rect x="284" y="198" width="6" height="96"/>
    <rect x="296" y="198" width="10" height="96"/>
    <rect x="312" y="198" width="6" height="96"/>
  </g>

  <!-- Золотая линия сканирования -->
  <g clip-path="url(#cardClip)">
    <rect x="120" y="286" width="272" height="18" rx="9" fill="url(#goldGrad)" transform="rotate(-6 256 295)"/>
  </g>
</svg>
