<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE9FF"/>
      <stop offset="0.5" stop-color="#E8DDFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
  </defs>

  <!-- скруглённый квадрат иконки на весь холст -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- контур карточки -->
  <rect x="116" y="156" width="280" height="200" rx="32" fill="#FFFFFF" stroke="#5C6BC0" stroke-width="18"/>

  <!-- штрихкод: шесть линий переменной толщины -->
  <g fill="#5C6BC0">
    <rect x="181" y="192" width="16" height="92" rx="8"/>
    <rect x="211" y="192" width="8"  height="92" rx="4"/>
    <rect x="233" y="192" width="20" height="92" rx="10"/>
    <rect x="267" y="192" width="8"  height="92" rx="4"/>
    <rect x="289" y="192" width="16" height="92" rx="8"/>
    <rect x="319" y="192" width="12" height="92" rx="6"/>
  </g>

  <!-- линия подписи под штрихкодом -->
  <rect x="216" y="312" width="80" height="16" rx="8" fill="#5C6BC0"/>
</svg>
