<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE9FF"/>
      <stop offset="0.55" stop-color="#E8DDFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background tile: rounded square on pastel gradient -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  </g>

  <!-- Composition: tilted loyalty card with barcode, flat, no strokes/shadows -->
  <g transform="rotate(-12 256 256)">
    <!-- back card, peeking from behind, lighter indigo -->
    <rect x="142" y="148" width="248" height="168" rx="26" fill="#8C9BD8" transform="rotate(6 266 232)"/>
    <!-- front card, brand indigo -->
    <rect x="126" y="166" width="260" height="180" rx="28" fill="#5C6BC0"/>
    <!-- barcode: white bars drawn as rects -->
    <g fill="#FFFFFF">
      <rect x="161" y="202" width="22" height="108" rx="8"/>
      <rect x="195" y="202" width="12" height="108" rx="6"/>
      <rect x="221" y="202" width="30" height="108" rx="10"/>
      <rect x="265" y="202" width="14" height="108" rx="6"/>
      <rect x="291" y="202" width="22" height="108" rx="8"/>
      <rect x="325" y="202" width="26" height="108" rx="9"/>
    </g>
  </g>
</svg>
